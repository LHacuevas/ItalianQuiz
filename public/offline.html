<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sei offline</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8f8f8, #e0e0e0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 90%;
      width: 400px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #d32f2f;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background-color: #1976d2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #115293;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📴</div>
    <h1>Nessuna connessione</h1>
    <p>Non sei connesso a Internet. Riprova più tardi o controlla la tua rete.</p>
    <button onclick="window.location.reload()">Riprova</button>
  </div>
</body>
</html>
